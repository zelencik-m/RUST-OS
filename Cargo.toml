[package]
name = "rust-os-blog"
version = "0.1.0"
edition = "2021"

[dependencies]
pc-keyboard = "0.7.0"
pic8259 = "0.10.1"
uart_16550 = "0.6.0"
x86_64 = { version = "0.14.2", default-features = false, features = ["instructions", "abi_x86_interrupt"] }
bootloader = { version = "0.9", features = ["map_physical_memory"]}
volatile = "0.2.6"
spin = "0.5.2"
linked_list_allocator = "0.9.0"

[profile.release]
panic = "abort"

[[bin]]
name = "rust-os-blog"
test = true
bench = false

[dependencies.lazy_static]
version = "1.0"
features = ["spin_no_std"]

[package.metadata.bootimage]
test-timeout = 300
test-args = [
    "-device", "isa-debug-exit,iobase=0xf4,iosize=0x04", "-serial", "stdio",
    "-display", "none"
]
test-success-exit-code = 33